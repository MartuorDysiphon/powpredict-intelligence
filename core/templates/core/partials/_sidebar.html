{% load static %}
<aside class="sidebar">
  <div class="sb-brand">
    <div class="sb-mark">
      <img src="{% static 'powpredict.png' %}" alt="">
    </div>
    <div class="sb-brand-txt">
      <div class="sb-name">Powpredict</div>
      <div class="sb-sub">Intelligence</div>
    </div>
  </div>

  <nav class="sb-nav" id="sbNav">
    <div class="sb-label">Menu</div>

    <a class="sb-item {% if active_page == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}" data-page="dashboard" data-tip="Dashboard">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      <span>Dashboard</span>
    </a>

    <a class="sb-item {% if active_page == 'predictor' %}active{% endif %}" href="{% url 'predictor' %}" data-page="predictor" data-tip="Predictor">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
      <span>Predictor</span>
    </a>

    <a class="sb-item {% if active_page == 'results' %}active{% endif %}" href="{% url 'results' %}" data-page="results" data-tip="Results">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>Results</span>
    </a>

    <a class="sb-item {% if active_page == 'analytics' %}active{% endif %}" href="{% url 'analytics' %}" data-page="analytics" data-tip="Analytics">
      <svg viewBox="0 0 24 24"><path d="M4 19V5M4 15l5-4 4 3 7-6"/></svg>
      <span>Analytics</span>
    </a>

    <a class="sb-item {% if active_page == 'history' %}active{% endif %}" href="{% url 'history' %}" data-page="history" data-tip="History">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span>History</span>
    </a>
  </nav>
</aside>
